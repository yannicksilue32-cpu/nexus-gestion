services:
  - type: web
    name: nexus-gestion
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-gestion-db
          property: connectionString
      - key: NEXUS_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.14.3

databases:
  - name: nexus-gestion-db
    plan: free
