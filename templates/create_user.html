<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un utilisateur - Nexus Gestion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin-top: 8px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .help {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .flash {
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column-reverse;
            }

            .buttons .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>👤 Nouvel utilisateur</h1>
        <p>Créer un nouveau compte pour accéder à Nexus Gestion.</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">

        <form method="POST"
              action="{{ url_for('create_user') }}">

            <div class="form-group">

                <label for="full_name">
                    Nom complet
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Ex : Jean Kouassi"
                    required
                >

            </div>

            <div class="form-group">

                <label for="username">
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ex : jean.kouassi"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

                <span class="help">
                    Le mot de passe doit contenir au minimum 8 caractères.
                </span>

            </div>

            <div class="form-group">

                <label for="role">
                    Rôle
                </label>

                <select id="role"
                        name="role"
                        required>

                    <option value="employee">
                        Employé
                    </option>

                    <option value="admin">
                        Administrateur
                    </option>

                </select>

            </div>

            <div class="buttons">

                <a href="{{ url_for('users') }}"
                   class="btn btn-secondary">
                    Annuler
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Créer l'utilisateur
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
