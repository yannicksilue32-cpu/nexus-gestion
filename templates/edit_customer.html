<div>

required
>

</div>


<div>

<input

</div>

<input

name="email"

>

</div>


<div>

<label>Adresse</label>

<input
type="text"
name="address"
value="{{ customer['address'] or '' }}"
>

</div>


<button type="submit">
💾 Enregistrer
</button>

</form>

<br>

<a href="/customers">
← Retour aux clients
</a>

</section>

</main>
